name: Privacy guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        run: python3 scripts/install_privacy_guard.py --ci
      - name: Scan reachable history and block on privacy findings
        shell: bash
        run: |
          export GITLEAKS_BIN="$(git rev-parse --path-format=absolute --git-common-dir)/privacy-tools/gitleaks"
          python3 scripts/privacy_guard.py --history
      - name: Verify privacy rules and real Git hook rejection
        shell: bash
        run: |
          export GITLEAKS_BIN="$(git rev-parse --path-format=absolute --git-common-dir)/privacy-tools/gitleaks"
          python3 -m unittest discover -s tests/privacy -v
