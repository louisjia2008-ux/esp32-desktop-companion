[platformio]
default_envs = deskpet_sensors
core_dir = .pio-core

[env:jc3248w535]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash + 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Tolerate observed sub-second LAN jitter while keeping an unavailable
    ; transport bounded. Independent touch acquisition buffers this wait.
    -DWEBSOCKETS_TCP_TIMEOUT=1500
    ; Lets Arduino_GFX enable its built-in u8g2 (CJK) font renderer without
    ; the full U8g2 library; see include/u8g2_shim/U8g2lib.h.
    -Iinclude/u8g2_shim

lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    bitbank2/JPEGDEC@1.8.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Explicit one-candidate receive-only probe. Default firmware does not use UART.
[env:ld2410c_rx_probe]
extends = env:jc3248w535
build_flags =
    ${env:jc3248w535.build_flags}
    -DSENSOR_LD2410C_RX_PROBE=1

; SCD41 only: dedicated I2C controller 1; touch retains controller 0.
[env:scd41_probe]
extends = env:jc3248w535
build_flags =
    ${env:jc3248w535.build_flags}
    -DSENSOR_SCD41_PROBE=1
lib_deps =
    ${env:jc3248w535.lib_deps}
    sensirion/Sensirion I2C SCD4x@1.1.0
    sensirion/Sensirion Core@0.7.3

; Explicit integration test; each sensor retains its independent worker/bus.
[env:dual_sensor_probe]
extends = env:scd41_probe
build_flags =
    ${env:scd41_probe.build_flags}
    -DSENSOR_LD2410C_RX_PROBE=1
    -DSENSOR_DUAL_PROBE=1

; Daily-use local services. Probe environments above remain explicit fallbacks.
[env:deskpet_sensors]
extends = env:jc3248w535
build_flags =
    ${env:jc3248w535.build_flags}
    -DSENSOR_SERVICE_ENABLED=1
lib_deps =
    ${env:jc3248w535.lib_deps}
    sensirion/Sensirion I2C SCD4x@1.1.0
    sensirion/Sensirion Core@0.7.3
